name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: uts-housing-frontend/package-lock.json
      - run: npm ci
        working-directory: uts-housing-frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: uts-housing-frontend

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: housing_test
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing -d housing_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://housing:housing_test_only@127.0.0.1:5432/housing_test?schema=public
      TEST_DATABASE_URL: postgresql://housing:housing_test_only@127.0.0.1:5432/housing_test?schema=public
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
      FRONTEND_ORIGIN: http://localhost:5173
      PRISMA_SKIP_POSTINSTALL_GENERATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: uts-housing-api/package-lock.json
      - run: npm ci
        working-directory: uts-housing-api
      - run: npm run db:generate && npm run db:deploy
        working-directory: uts-housing-api
      - run: npm run typecheck && npm test -- --fileParallelism=false && npm run build
        working-directory: uts-housing-api
      - name: Check fictional seed on first and repeated runs
        run: |
          CONFIRM_DEMO_SEED=1 npm run db:seed
          CONFIRM_DEMO_SEED=1 npm run db:seed
          node --import tsx --input-type=module -e 'import { prisma } from "./src/core/db.ts"; const listing = await prisma.listing.findUnique({ where: { id: "30000000-0000-4000-8000-000000000001" } }); await prisma.$disconnect(); if (listing?.status !== "PUBLISHED") process.exit(1)'
        working-directory: uts-housing-api
