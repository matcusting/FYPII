name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uts-housing-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uts
          POSTGRES_PASSWORD: uts_dev_password
          POSTGRES_DB: uts_housing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uts" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://uts:uts_dev_password@localhost:5432/uts_housing_test
      TEST_DATABASE_URL: postgresql://uts:uts_dev_password@localhost:5432/uts_housing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uts-housing-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uts-housing-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uts-housing-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
