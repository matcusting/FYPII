# Infrastructure definition only. autoDeploy is disabled; importing this file
# does not deploy anything until the project owner explicitly creates a Blueprint.
services:
  - type: web
    name: uts-housing
    runtime: docker
    plan: starter
    autoDeploy: false
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile.render
    healthCheckPath: /health/ready
    disk:
      name: uts-housing-private-media
      mountPath: /srv/housing/private
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PREVIEW_REQUIRED
        value: "1"
      - key: PREVIEW_ACCESS_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uts-housing-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MEDIA_PRIVATE_DIR
        value: /srv/housing/private
      - key: MALWARE_SCAN_MODE
        value: clamav
      # Replace with the private hostname Render displays for this service if needed.
      - key: CLAMAV_HOST
        value: uts-housing-clamav
      - key: CLAMAV_PORT
        value: "3310"
      - key: SMS_PROVIDER
        value: disabled
      - key: GEOCODER_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: pserv
    name: uts-housing-clamav
    runtime: docker
    plan: starter
    autoDeploy: false
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile.clamav
    envVars:
      - key: PORT
        value: "3310"

  - type: worker
    name: uts-housing-email-worker
    runtime: docker
    plan: starter
    autoDeploy: false
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile.api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uts-housing-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: uts-housing-db
    plan: basic-1gb
    databaseName: housing
    user: housing
