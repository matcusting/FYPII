services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housing
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - housing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing"]
      interval: 5s
      timeout: 3s
      retries: 12

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - housing_clamav_signatures:/var/lib/clamav

volumes:
  housing_postgres_data:
  housing_clamav_signatures:
